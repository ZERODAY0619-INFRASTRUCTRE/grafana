pid /tmp/nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 256; }
http {
  access_log off;
  client_body_temp_path /tmp/client_body;
  proxy_temp_path /tmp/proxy;
  fastcgi_temp_path /tmp/fastcgi;
  uwsgi_temp_path /tmp/uwsgi;
  scgi_temp_path /tmp/scgi;
  resolver 127.0.0.11 valid=10s ipv6=off;
  server {
    listen 8080;
    client_max_body_size 4m;
    location = /.well-known/grafana-telemetry {
      default_type application/json;
      return 200 '{"service":"grafana-telemetry","version":1,"transport":"otlp-http"}';
    }
    location = /ready {
      set $health http://otel-collector:13133;
      proxy_pass $health/;
      proxy_connect_timeout 3s;
    }
    location ~ ^/v1/(logs|metrics|traces)$ {
      limit_except POST { deny all; }
      set $collector http://otel-collector:4318;
      proxy_pass $collector;
      proxy_connect_timeout 3s;
      proxy_read_timeout 30s;
    }
    location / { return 404; }
  }
}
